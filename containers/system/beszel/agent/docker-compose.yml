# Beszel agent: started by ../post-start.sh once the hub has a key pair.
name: beszel-agent
services:
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      # Docker's API has no read-only mode: :ro protects the socket file only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_agent_data:/var/lib/beszel-agent
    environment:
      LISTEN: 45876
      KEY: ${BESZEL_AGENT_KEY:?written by ../post-start.sh from the hub key}
