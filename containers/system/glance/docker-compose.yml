# Glance: the start page at home.<DOMAIN>. config/glance.yml and config/home.yml
# are yours to edit; config/apps.yml is regenerated by install.sh with every
# app you installed.
services:
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
      # For the containers widget. Docker's API has no read-only mode: :ro
      # protects the socket file, not what can be done through it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The dashboard health-checks each app at host.docker.internal:<port>.
    extra_hosts:
      - host.docker.internal:host-gateway
