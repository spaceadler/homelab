# Nomie → http://track.<domain>; its CouchDB → http://trackdb.<domain>
server {
    include snippets/listen.conf;
    server_name track.*;
    location / {
        proxy_pass http://127.0.0.1:5005;
        include snippets/proxy.conf;
    }
}

server {
    include snippets/listen.conf;
    server_name trackdb.*;
    location / {
        proxy_pass http://127.0.0.1:5984;
        include snippets/proxy.conf;
    }
}
