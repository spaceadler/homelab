# Included in the location block of an app that refuses to be shown inside
# another page (X-Frame-Options, or CSP frame-ancestors): adlerOS (os.<domain>,
# homelab.conf's $adleros_origin) may show it in a window; any other site
# still can't. Its own Content-Security-Policy goes with it: nginx can't
# change one line of a header, only drop it and send another.
proxy_hide_header X-Frame-Options;
proxy_hide_header Content-Security-Policy;
add_header Content-Security-Policy "frame-ancestors $adleros_origin" always;
