upstream sp_app    { server app:80; }
upstream sp_webdav { server webdav:6065; }

server {
    listen 80;
    server_name _;
    client_max_body_size 512m;

    location / {
        proxy_pass http://sp_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Radicale, through its published port on the host.
    location /caldav/ {
        proxy_pass http://host.docker.internal:5222/;
        proxy_set_header X-Script-Name     /caldav;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /webdav/ {
        proxy_pass http://sp_webdav;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
